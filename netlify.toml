[build]
  # Copies the site to dist/ and writes the live address (Netlify's $URL) into
  # the og:image tag on every page, which link previews need as an absolute URL.
  command = 'rm -rf dist && cp -R public dist && find dist -name "*.html" -exec sed -i.bak "s|%SITE_URL%|$URL|g" {} + && find dist -name "*.html.bak" -delete'
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/assets/media/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
